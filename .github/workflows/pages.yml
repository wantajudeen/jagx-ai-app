name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject Supabase config into site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          python3 - << 'PY'
import os
from pathlib import Path
html = Path("index.html").read_text()
url = os.environ.get("SUPABASE_URL", "").strip()
key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
html = html.replace("__SUPABASE_URL__", url)
html = html.replace("__SUPABASE_ANON_KEY__", key)
Path("_site/index.html").write_text(html)
print("injected", bool(url), bool(key))
PY
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
