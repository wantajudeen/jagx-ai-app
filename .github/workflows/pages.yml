name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase + API into index.html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          python3 << 'PY'
          import os
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          url = (os.environ.get("SUPABASE_URL") or "").strip()
          key = (os.environ.get("SUPABASE_ANON_KEY") or "").strip()
          if not url or not key:
              print("WARNING: SUPABASE secrets empty — auth will show setup message")
          else:
              print("Injecting SUPABASE_URL length", len(url), "key length", len(key))
          html = html.replace("__SUPABASE_URL__", url)
          html = html.replace("__SUPABASE_ANON_KEY__", key)
          Path("index.html").write_text(html, encoding="utf-8")
          Path("_site").mkdir(exist_ok=True)
          Path("_site/index.html").write_text(html, encoding="utf-8")
          if Path("CNAME").exists():
              Path("_site/CNAME").write_text(Path("CNAME").read_text())
          print("site ready")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
