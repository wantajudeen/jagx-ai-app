name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with Supabase config.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          mkdir -p _site
          python3 << 'PY'
          import os, json
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          url = (os.environ.get("SUPABASE_URL") or "").strip()
          key = (os.environ.get("SUPABASE_ANON_KEY") or "").strip()
          if url and key:
              html = html.replace("__SUPABASE_URL__", url)
              html = html.replace("__SUPABASE_ANON_KEY__", key)
              # also replace placeholder hardcode if present
              import re
              html = re.sub(
                  r"var SUPABASE_ANON_KEY = '[^']*';",
                  f"var SUPABASE_ANON_KEY = '{key}';",
                  html,
                  count=1,
              )
              html = re.sub(
                  r"var SUPABASE_URL = '[^']*';",
                  f"var SUPABASE_URL = '{url}';",
                  html,
                  count=1,
              )
              Path("_site/config.json").write_text(
                  json.dumps({"url": url, "anon": key}), encoding="utf-8"
              )
              print("injected secrets ok", len(url), len(key))
          else:
              print("WARNING: secrets empty")
              Path("_site/config.json").write_text("{}", encoding="utf-8")
          Path("_site/index.html").write_text(html, encoding="utf-8")
          if Path("CNAME").exists():
              Path("_site/CNAME").write_text(Path("CNAME").read_text())
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
