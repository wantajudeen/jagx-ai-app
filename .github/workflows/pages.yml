name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Supabase secrets into site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          python3 << 'PY'
          import os, re, json
          from pathlib import Path

          url = (os.environ.get("SUPABASE_URL") or "").strip()
          key = (os.environ.get("SUPABASE_ANON_KEY") or "").strip()
          if not url or not key:
              raise SystemExit("Missing SUPABASE_URL or SUPABASE_ANON_KEY secrets")

          html = Path("index.html").read_text(encoding="utf-8")
          html = html.replace("__SUPABASE_URL__", url)
          html = html.replace("__SUPABASE_ANON_KEY__", key)
          html = re.sub(r"var SUPABASE_URL = '[^']*';", f"var SUPABASE_URL = '{url}';", html, count=1)
          html = re.sub(r"var SUPABASE_ANON_KEY = '[^']*';", f"var SUPABASE_ANON_KEY = '{key}';", html, count=1)
          Path("index.html").write_text(html, encoding="utf-8")
          Path("config.json").write_text(json.dumps({"url": url, "anon": key}), encoding="utf-8")
          print("injected", len(url), len(key))
          PY

      - name: Publish to gh-pages branch (wins over broken root deploy)
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # orphan branch with only site files
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp index.html config.json /tmp/site/
          if [ -f CNAME ]; then cp CNAME /tmp/site/; fi
          cd /tmp/site
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy site with Supabase config"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wantajudeen/jagx-ai-app.git"
          git push -f origin gh-pages

      - name: Also deploy via Actions Pages artifact
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
