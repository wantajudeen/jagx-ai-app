name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: .env from secrets
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Icon
        run: |
          mkdir -p assets/icons
          python3 << 'PY'
          from struct import pack
          import zlib
          def chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          w = h = 512
          rows = []
          for y in range(h):
              row = b"\x00"
              for x in range(w):
                  r2 = (x - 256)**2 + (y - 256)**2
                  on = (290<=x<=340 and 120<=y<=340) or (180<=x<=340 and 120<=y<=160) or (180<=x<=280 and 320<=y<=380) or (140<=x<=190 and 260<=y<=380)
                  if r2 > 230*230: on = False
                  c = (0,0,0) if r2 > 240*240 else ((245,245,245) if on else (12,12,12))
                  row += bytes(c)
              rows.append(row)
          raw = b"".join(rows)
          ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("assets/icons/app_icon.png", "wb").write(png)
          PY

      - name: Platforms + restore lib
        run: |
          cp -a lib lib.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          rm -rf lib && mv lib.bak lib
          mv pubspec.yaml.bak pubspec.yaml

      - name: Android patches
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          [ -f "$MANIFEST" ] && sed -i 's/android:label="[^"]*"/android:label="JagX AI"/' "$MANIFEST" || true
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$f" || true
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' "$f" || true
            sed -i 's/minSdk = [0-9]*/minSdk = 24/' "$f" || true
          done
          if [ -f "$MANIFEST" ] && ! grep -q 'io.supabase.jagxai' "$MANIFEST"; then
            python3 -c "
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          i='''\n                <intent-filter>\n                    <action android:name=\"android.intent.action.VIEW\"/>\n                    <category android:name=\"android.intent.category.DEFAULT\"/>\n                    <category android:name=\"android.intent.category.BROWSABLE\"/>\n                    <data android:scheme=\"io.supabase.jagxai\" android:host=\"login-callback\"/>\n                </intent-filter>'''
          p.write_text(t.replace('</activity>', i+'\n        </activity>', 1))
          "
          fi

      - run: flutter pub get
      - run: dart run flutter_launcher_icons || true
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: jagx-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Web
        run: flutter build web --release --base-href "/"

      - uses: actions/upload-artifact@v4
        with:
          name: jagx-web
          path: build/web

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: .env
        shell: bash
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Icon placeholder
        shell: bash
        run: |
          mkdir -p assets/icons
          # minimal valid 1x1 png if missing
          python -c "import struct,zlib;open('assets/icons/app_icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+struct.pack('>I',13)+b'IHDR'+struct.pack('>IIBBBBB',1,1,8,2,0,0,0)+struct.pack('>I',zlib.crc32(b'IHDR'+struct.pack('>IIBBBBB',1,1,8,2,0,0,0))&0xffffffff)+struct.pack('>I',12)+b'IDAT'+zlib.compress(b'\x00\x00\x00\x00\x00')+struct.pack('>I',zlib.crc32(b'IDAT'+zlib.compress(b'\x00\x00\x00\x00\x00'))&0xffffffff)+struct.pack('>I',0)+b'IEND'+struct.pack('>I',zlib.crc32(b'IEND')&0xffffffff))" 2>/dev/null || true

      - name: Create windows platform
        shell: bash
        run: |
          cp -a lib lib.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=windows
          rm -rf lib && mv lib.bak lib
          mv pubspec.yaml.bak pubspec.yaml

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip Windows build
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../jagx-windows.zip * || powershell Compress-Archive -Path * -DestinationPath ../../../../../jagx-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jagx-windows
          path: jagx-windows.zip
          if-no-files-found: warn

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Icon
        run: mkdir -p assets/icons && python3 -c "open('assets/icons/app_icon.png','wb').write(bytes.fromhex('89504e470d0a1a0a0000000d4948445200000001000000010802000000907753de0000000c4944415408d763f8ffff3f0005fe02fe0e6b5a1e0000000049454e44ae426082'))"

      - name: Create ios platform
        run: |
          cp -a lib lib.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=ios
          rm -rf lib && mv lib.bak lib
          mv pubspec.yaml.bak pubspec.yaml

      - run: flutter pub get

      - name: Build iOS (no codesign — needs Apple Developer for device install)
        run: flutter build ios --release --no-codesign

      - name: Zip iOS build
        run: |
          cd build/ios/iphoneos
          zip -r ../../../../jagx-ios-unsigned.zip Runner.app || true

      - uses: actions/upload-artifact@v4
        with:
          name: jagx-ios-unsigned
          path: jagx-ios-unsigned.zip
          if-no-files-found: warn
