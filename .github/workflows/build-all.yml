name: Legacy Kotlin build (disabled)

# Disabled: repo primary app is Flutter. Use "Build Flutter Android APK" instead.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Only run if you intentionally need the old Kotlin path"
        required: true
        default: "no"

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Legacy Kotlin workflow is disabled."
          echo "Use Actions → Build Flutter Android APK."
          if [ "${{ github.event.inputs.force }}" != "yes" ]; then
            exit 0
          fi
