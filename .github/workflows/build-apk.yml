name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable + fetch wrapper jar
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          # Ensure properties exist
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          ls -la gradlew gradle/wrapper/

      - name: Generate JagX icons (angular J + circuit)
        run: |
          python3 scripts/make_jagx_icon.py /tmp/icon512.png 512
          for pair in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            size="${pair%%:*}"
            folder="${pair##*:}"
            mkdir -p "app/src/main/res/$folder"
            python3 scripts/make_jagx_icon.py "app/src/main/res/$folder/ic_launcher.png" "$size"
            cp "app/src/main/res/$folder/ic_launcher.png" "app/src/main/res/$folder/ic_launcher_round.png"
          done
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">JagX AI</string>
</resources>
EOF
          echo "Icons ready"
          ls -la app/src/main/res/mipmap-*/

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build_log.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: build_log.txt

      - name: Prepare APK + .jagx
        if: success()
        run: |
          mkdir -p downloads
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          cp "$APK" downloads/JagX-AI.apk
          cp "$APK" downloads/JagX-AI.jagx
          ls -lh downloads/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JagX-AI-Android-APK
          path: |
            downloads/JagX-AI.apk
            downloads/JagX-AI.jagx
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JagX AI Android APK (Kotlin)
          body: |
            Native Kotlin + Jetpack Compose + OpenRouter chat.
            Files: JagX-AI.apk + JagX-AI.jagx (JagX OS package)
            Uninstall old version first, then install.
          files: |
            downloads/JagX-AI.apk
            downloads/JagX-AI.jagx
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
