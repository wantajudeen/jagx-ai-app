name: Build Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install Pillow (icon generator)
        run: pip3 install --user pillow

      - name: Ensure .env exists for asset bundle
        run: |
          if [ ! -f .env ]; then
            cat > .env << 'EOT'
SUPABASE_URL=
SUPABASE_ANON_KEY=
OPENROUTER_API_KEY=
JAGX_API_BASE=https://jagx-ai-v2.onrender.com
JAGX_API_KEY=
EOT
          fi
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            grep -q '^OPENROUTER_API_KEY=' .env || echo 'OPENROUTER_API_KEY=' >> .env
            sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}|" .env
          fi
          if [ -n "${{ secrets.JAGX_API_KEY }}" ]; then
            grep -q '^JAGX_API_KEY=' .env || echo 'JAGX_API_KEY=' >> .env
            sed -i "s|^JAGX_API_KEY=.*|JAGX_API_KEY=${{ secrets.JAGX_API_KEY }}|" .env
          fi
          if [ -n "${{ secrets.JAGX_API_BASE }}" ]; then
            grep -q '^JAGX_API_BASE=' .env || echo 'JAGX_API_BASE=' >> .env
            sed -i "s|^JAGX_API_BASE=.*|JAGX_API_BASE=${{ secrets.JAGX_API_BASE }}|" .env
          fi
          echo "Env keys present (values hidden):"
          cut -d= -f1 .env || true

      - name: Ensure Android platform + icon asset
        run: |
          mkdir -p assets/icons
          if [ ! -f assets/icons/app_icon.png ]; then
            python3 - << 'PY'
from PIL import Image, ImageDraw, ImageFont
size=1024
img=Image.new('RGBA',(size,size),(0,0,0,255))
d=ImageDraw.Draw(img)
d.ellipse([80,80,size-80,size-80], outline=(124,58,237,255), width=28)
try:
  font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',520)
except Exception:
  font=ImageFont.load_default()
bbox=d.textbbox((0,0),'J',font=font)
tw,th=bbox[2]-bbox[0],bbox[3]-bbox[1]
d.text(((size-tw)/2-bbox[0], (size-th)/2-bbox[1]-20),'J',font=font,fill=(255,255,255,255))
img.save('assets/icons/app_icon.png')
print('icon created')
PY
          fi
          if [ ! -d android ]; then
            flutter create --platforms=android,web .
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JagX-AI-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (optional)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JagX AI APK (latest)
          files: build/app/outputs/flutter-apk/app-release.apk
          body: Flutter release APK built from main. JagX and JRILICENSE.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
