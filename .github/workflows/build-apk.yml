name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: Assets + icon
        run: |
          mkdir -p assets/icons
          python3 -c "
          from struct import pack
          import zlib
          def chunk(tag, data):
              return pack('>I', len(data)) + tag + data + pack('>I', zlib.crc32(tag + data) & 0xffffffff)
          w=h=512
          rows=[]
          for y in range(h):
              row=b'\\x00'
              for x in range(w):
                  cx,cy=256,256
                  r2=(x-cx)**2+(y-cy)**2
                  on=False
                  if 290<=x<=340 and 120<=y<=340: on=True
                  if 180<=x<=340 and 120<=y<=160: on=True
                  if 180<=x<=280 and 320<=y<=380: on=True
                  if 140<=x<=190 and 260<=y<=380: on=True
                  if r2>230*230: on=False
                  c=(5,5,6) if r2>240*240 else ((228,228,231) if on else (10,10,12))
                  row+=bytes(c)
              rows.append(row)
          raw=b''.join(rows)
          ihdr=pack('>IIBBBBB',w,h,8,2,0,0,0)
          png=b'\\x89PNG\\r\\n\\x1a\\n'+chunk(b'IHDR',ihdr)+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open('assets/icons/app_icon.png','wb').write(png)
          "

      - name: Platforms
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          fi

      - name: App label
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="JagX AI"/' android/app/src/main/AndroidManifest.xml || true
          fi

      - run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jagx-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
