name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: App icon
        run: |
          mkdir -p assets/icons
          python3 << 'PY'
          from struct import pack
          import zlib
          def chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          w = h = 512
          rows = []
          for y in range(h):
              row = b"\x00"
              for x in range(w):
                  r2 = (x - 256) ** 2 + (y - 256) ** 2
                  on = (290 <= x <= 340 and 120 <= y <= 340) or (180 <= x <= 340 and 120 <= y <= 160) or (180 <= x <= 280 and 320 <= y <= 380) or (140 <= x <= 190 and 260 <= y <= 380)
                  if r2 > 230 * 230:
                      on = False
                  c = (0, 0, 0) if r2 > 240 * 240 else ((245, 245, 245) if on else (12, 12, 12))
                  row += bytes(c)
              rows.append(row)
          raw = b"".join(rows)
          ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("assets/icons/app_icon.png", "wb").write(png)
          PY

      - name: Flutter create platforms (keep our lib)
        run: |
          cp -a lib /tmp/jagx_lib
          cp pubspec.yaml /tmp/jagx_pubspec.yaml
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          rm -rf lib
          cp -a /tmp/jagx_lib lib
          cp /tmp/jagx_pubspec.yaml pubspec.yaml

      - name: Generate upload keystore (sideload-signed APK)
        run: |
          keytool -genkey -v \
            -keystore android/app/jagx-upload.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias jagx \
            -storepass jagxai2026 \
            -keypass jagxai2026 \
            -dname "CN=JagX AI, OU=JagX, O=JRILICENSE, L=Lagos, ST=LA, C=NG"

      - name: key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=jagxai2026
          keyPassword=jagxai2026
          keyAlias=jagx
          storeFile=jagx-upload.jks
          EOF

      - name: Patch Android Gradle for release signing + SDK
        run: |
          python3 << 'PY'
          from pathlib import Path

          # Prefer .kts (newer Flutter)
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              t = kts.read_text()
              # inject signing if missing
              if "key.properties" not in t:
                  inject = '''
val keystoreProperties = java.util.Properties()
val keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
}
'''
                  t = t.replace("android {", inject + "\nandroid {", 1)
                  t = t.replace(
                      "buildTypes {",
                      '''signingConfigs {
        create("release") {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"] as String
                keyPassword = keystoreProperties["keyPassword"] as String
                storeFile = file(keystoreProperties["storeFile"] as String)
                storePassword = keystoreProperties["storePassword"] as String
            }
        }
    }
    buildTypes {
''',
                      1,
                  )
                  t = t.replace(
                      "release {",
                      "release {\n            signingConfig = signingConfigs.getByName(\"release\")",
                      1,
                  )
              t = t.replace("compileSdk = 34", "compileSdk = 35")
              t = t.replace("compileSdk = 33", "compileSdk = 35")
              t = t.replace("targetSdk = 34", "targetSdk = 35")
              t = t.replace("targetSdk = 33", "targetSdk = 35")
              t = t.replace("minSdk = 21", "minSdk = 24")
              kts.write_text(t)
              print("patched build.gradle.kts")
          elif groovy.exists():
              t = groovy.read_text()
              if "key.properties" not in t:
                  inject = '''
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
'''
                  t = t.replace("android {", inject + "\nandroid {", 1)
                  t = t.replace(
                      "buildTypes {",
                      """signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
""",
                      1,
                  )
                  t = t.replace(
                      "release {",
                      "release {\n            signingConfig signingConfigs.release",
                      1,
                  )
              groovy.write_text(t)
              print("patched build.gradle")

          man = Path("android/app/src/main/AndroidManifest.xml")
          if man.exists():
              m = man.read_text()
              m = m.replace('android:label="jagx_ai"', 'android:label="JagX AI"')
              m = m.replace('android:label="jagx ai"', 'android:label="JagX AI"')
              if "android.permission.INTERNET" not in m:
                  m = m.replace(
                      "<manifest",
                      '<manifest',
                      1,
                  )
                  m = m.replace(
                      ">",
                      '>\n    <uses-permission android:name="android.permission.INTERNET"/>',
                      1,
                  )
              if "io.supabase.jagxai" not in m:
                  intent = '''
                <intent-filter>
                    <action android:name="android.intent.action.VIEW"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <category android:name="android.intent.category.BROWSABLE"/>
                    <data android:scheme="io.supabase.jagxai" android:host="login-callback"/>
                </intent-filter>'''
                  m = m.replace("</activity>", intent + "\n        </activity>", 1)
              man.write_text(m)
              print("patched manifest")
          PY

      - name: Pub get
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build signed release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK exists
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JagX-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
