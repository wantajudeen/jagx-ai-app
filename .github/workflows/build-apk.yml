name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Generate JagX icon
        run: |
          mkdir -p assets/icons
          if [ -f scripts/make_jagx_icon.py ]; then
            python3 scripts/make_jagx_icon.py assets/icons/app_icon.png 512
            python3 scripts/make_jagx_icon.py assets/icons/app_icon_fg.png 512
          else
            python3 -c "print('icon script missing')" && exit 1
          fi

      - name: Flutter create (keep app source)
        run: |
          cp -a lib /tmp/jagx_lib
          cp pubspec.yaml /tmp/jagx_pubspec.yaml
          cp -a assets /tmp/jagx_assets 2>/dev/null || true
          cp -a scripts /tmp/jagx_scripts 2>/dev/null || true
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          rm -rf lib
          cp -a /tmp/jagx_lib lib
          cp /tmp/jagx_pubspec.yaml pubspec.yaml
          mkdir -p assets/icons scripts
          cp -a /tmp/jagx_assets/. assets/ 2>/dev/null || true
          cp -a /tmp/jagx_scripts/. scripts/ 2>/dev/null || true
          python3 scripts/make_jagx_icon.py assets/icons/app_icon.png 512
          python3 scripts/make_jagx_icon.py assets/icons/app_icon_fg.png 512
          test -f assets/icons/app_icon.png

      - name: Patch Android (SDK 36 + signing + label)
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          man = Path("android/app/src/main/AndroidManifest.xml")
          if man.exists():
              m = man.read_text()
              m = re.sub(r'android:label="[^"]*"', 'android:label="JagX AI"', m)
              if "android.permission.INTERNET" not in m:
                  m = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                      m,
                      count=1,
                  )
              if "io.supabase.jagxai" not in m:
                  intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.jagxai" android:host="login-callback"/>
                  </intent-filter>'''
                  m = m.replace("</activity>", intent + "\n        </activity>", 1)
              man.write_text(m)

          for name in ("build.gradle.kts", "build.gradle"):
              p = Path("android/app") / name
              if not p.exists():
                  continue
              t = p.read_text()
              # Force compileSdk / targetSdk 36 (file_picker needs it)
              if name.endswith(".kts"):
                  t = re.sub(r"compileSdk\s*=\s*[^\n]+", "compileSdk = 36", t)
                  t = re.sub(r"targetSdk\s*=\s*[^\n]+", "targetSdk = 36", t)
                  t = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", t)
                  if "signingConfig" not in t and "release" in t:
                      t = re.sub(
                          r"(release\s*\{)",
                          r'\1\n            signingConfig = signingConfigs.getByName("debug")',
                          t,
                          count=1,
                      )
              else:
                  t = re.sub(r"compileSdk\s+[^\n]+", "compileSdk 36", t)
                  t = re.sub(r"targetSdk\s+[^\n]+", "targetSdk 36", t)
                  t = re.sub(r"minSdk\s+[^\n]+", "minSdk 24", t)
                  if "signingConfig" not in t and "release" in t:
                      t = re.sub(
                          r"(release\s*\{)",
                          r'\1\n            signingConfig signingConfigs.debug',
                          t,
                          count=1,
                      )
              p.write_text(t)
              print("patched", p)
              print(p.read_text()[:800])
          PY

      - run: flutter pub get

      - name: Apply launcher icons (force mipmaps)
        run: |
          dart run flutter_launcher_icons || true
          for size_folder in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            size="${size_folder%%:*}"
            folder="${size_folder##*:}"
            dir="android/app/src/main/res/$folder"
            mkdir -p "$dir"
            python3 scripts/make_jagx_icon.py "$dir/ic_launcher.png" "$size"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > android/app/src/main/res/values/colors.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          XML
          echo "Icons forced OK"

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-build-log
          path: build_log.txt

      - name: Copy APK for release
        if: success()
        run: |
          mkdir -p downloads
          cp build/app/outputs/flutter-apk/app-release.apk downloads/JagX-AI.apk
          ls -lh downloads/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JagX-AI-Android-APK
          path: downloads/JagX-AI.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JagX AI Android APK
          body: |
            JagX AI APK — angular circuit J icon.
            Uninstall old app first, then install JagX-AI.apk
          files: downloads/JagX-AI.apk
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
