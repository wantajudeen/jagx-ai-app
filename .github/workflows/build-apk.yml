name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env from secrets
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" \
            > .env
          cat .env | sed 's/=.*/=***/' 

      - name: Generate icon
        run: |
          mkdir -p assets/icons
          python3 << 'PY'
          from struct import pack
          import zlib
          def chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          w = h = 512
          rows = []
          for y in range(h):
              row = b"\x00"
              for x in range(w):
                  r2 = (x - 256) ** 2 + (y - 256) ** 2
                  on = (290 <= x <= 340 and 120 <= y <= 340) or (180 <= x <= 340 and 120 <= y <= 160) or (180 <= x <= 280 and 320 <= y <= 380) or (140 <= x <= 190 and 260 <= y <= 380)
                  if r2 > 230 * 230: on = False
                  c = (0,0,0) if r2 > 240*240 else ((245,245,245) if on else (12,12,12))
                  row += bytes(c)
              rows.append(row)
          raw = b"".join(rows)
          ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("assets/icons/app_icon.png", "wb").write(png)
          PY

      - name: Ensure Flutter platforms
        run: |
          # Backup critical sources
          cp -a lib lib.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          # Restore app source (flutter create must not wipe our UI)
          rm -rf lib
          mv lib.bak lib
          mv pubspec.yaml.bak pubspec.yaml

      - name: Android label + SDK + deep link
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="JagX AI"/' "$MANIFEST" || true
          fi
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$f" || true
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' "$f" || true
            sed -i 's/minSdk = [0-9]*/minSdk = 24/' "$f" || true
          done
          if [ -f "$MANIFEST" ] && ! grep -q 'io.supabase.jagxai' "$MANIFEST"; then
            python3 -c "
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          i='''\n                <intent-filter>\n                    <action android:name=\"android.intent.action.VIEW\"/>\n                    <category android:name=\"android.intent.category.DEFAULT\"/>\n                    <category android:name=\"android.intent.category.BROWSABLE\"/>\n                    <data android:scheme=\"io.supabase.jagxai\" android:host=\"login-callback\"/>\n                </intent-filter>'''
          p.write_text(t.replace('</activity>', i+'\n        </activity>', 1))
          "
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: jagx-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
