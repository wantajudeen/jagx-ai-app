name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Write .env from secrets
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF
          # Ensure file exists even if secrets empty
          test -f .env

      - name: Generate app icon
        run: |
          mkdir -p assets/icons
          python3 << 'PY'
          from struct import pack
          import zlib
          def chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          w = h = 512
          rows = []
          for y in range(h):
              row = b"\x00"
              for x in range(w):
                  r2 = (x - 256) ** 2 + (y - 256) ** 2
                  on = (
                      (290 <= x <= 340 and 120 <= y <= 340)
                      or (180 <= x <= 340 and 120 <= y <= 160)
                      or (180 <= x <= 280 and 320 <= y <= 380)
                      or (140 <= x <= 190 and 260 <= y <= 380)
                  )
                  if r2 > 230 * 230:
                      on = False
                  if r2 > 240 * 240:
                      c = (0, 0, 0)
                  elif on:
                      c = (245, 245, 245)
                  else:
                      c = (12, 12, 12)
                  row += bytes(c)
              rows.append(row)
          raw = b"".join(rows)
          ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("assets/icons/app_icon.png", "wb").write(png)
          print("icon", len(png))
          PY

      - name: Create Android / Web platforms (safe)
        run: |
          # Never wipe lib/ — only add missing platform folders
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          # Restore our sources if flutter create touched anything unexpected
          git checkout -- lib pubspec.yaml analysis_options.yaml 2>/dev/null || true

      - name: Patch Android config
        run: |
          set -e
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="JagX AI"/' android/app/src/main/AndroidManifest.xml || true
          fi
          # Gradle SDK levels
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$f" || true
              sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' "$f" || true
              sed -i 's/minSdk = [0-9]*/minSdk = 24/' "$f" || true
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$f" || true
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' "$f" || true
              sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' "$f" || true
            fi
          done
          # Deep link for Supabase OAuth return
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q 'io.supabase.jagxai' "$MANIFEST"; then
            python3 << 'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.jagxai" android:host="login-callback"/>
                  </intent-filter>'''
          # Insert before closing activity tag of MainActivity if possible
          t2 = t.replace("</activity>", intent + "\n        </activity>", 1)
          p.write_text(t2)
          print("deep link added")
          PY
          fi

      - name: Pub get
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons || echo "icons optional"

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jagx-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
