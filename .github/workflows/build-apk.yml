name: Build Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JAGX_API_KEY: ${{ secrets.JAGX_API_KEY }}
      JAGX_API_BASE: ${{ secrets.JAGX_API_BASE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          set -e
          python3 -m pip install --user pillow
          mkdir -p assets/icons
          python3 tooling/make_icon.py
          {
            echo "JAGX_API_KEY=${JAGX_API_KEY}"
            echo "JAGX_API_BASE=${JAGX_API_BASE:-https://jagx-ai-v2.onrender.com}"
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } > .env
          rm -rf android ios web linux macos windows
          flutter create --org com.jagx --project-name jagx_ai --platforms=android .

      - name: Pub get
        run: flutter pub get

      - name: Patch compileSdk + OAuth intent
        run: |
          python3 tooling/patch_sdk.py
          python3 tooling/patch_android_oauth.py

      - name: Launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_log.txt
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk JagX-AI.apk
          ls -la JagX-AI.apk

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build_log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JagX-AI-Flutter-APK
          path: JagX-AI.apk

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-latest
          name: JagX AI APK
          files: JagX-AI.apk
          body: Public APK — no GitHub account needed to download.
          make_latest: true
