name: Build Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JAGX_API_KEY: ${{ secrets.JAGX_API_KEY }}
      JAGX_API_BASE: ${{ secrets.JAGX_API_BASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install Pillow
        run: python3 -m pip install --user pillow

      - name: Write .env for Flutter assets
        run: |
          echo "SUPABASE_URL=" > .env
          echo "SUPABASE_ANON_KEY=" >> .env
          echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> .env
          if [ -n "$JAGX_API_BASE" ]; then
            echo "JAGX_API_BASE=${JAGX_API_BASE}" >> .env
          else
            echo "JAGX_API_BASE=https://jagx-ai-v2.onrender.com" >> .env
          fi
          echo "JAGX_API_KEY=${JAGX_API_KEY}" >> .env
          echo "Env keys written:"
          cut -d= -f1 .env

      - name: Create icon + Android platform
        run: |
          mkdir -p assets/icons scripts
          python3 scripts/generate_icon.py || python3 -c "from PIL import Image,ImageDraw; s=1024; i=Image.new('RGBA',(s,s),(0,0,0,255)); d=ImageDraw.Draw(i); d.ellipse((80,80,s-80,s-80),outline=(124,58,237,255),width=28); d.text((420,280),'J',fill=(255,255,255,255)); i.save('assets/icons/app_icon.png')"
          if [ ! -d android ]; then
            flutter create --org com.jagx --project-name jagx_ai --platforms=android .
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JagX-AI-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-latest
          name: JagX AI APK (latest)
          files: build/app/outputs/flutter-apk/app-release.apk
          body: Flutter APK by JagX and JRILICENSE.
