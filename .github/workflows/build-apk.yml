name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: App icon
        run: |
          mkdir -p assets/icons
          python3 << 'PY'
          from struct import pack
          import zlib
          def chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          w = h = 512
          rows = []
          for y in range(h):
              row = b"\x00"
              for x in range(w):
                  r2 = (x - 256) ** 2 + (y - 256) ** 2
                  on = (290 <= x <= 340 and 120 <= y <= 340) or (180 <= x <= 340 and 120 <= y <= 160) or (180 <= x <= 280 and 320 <= y <= 380) or (140 <= x <= 190 and 260 <= y <= 380)
                  if r2 > 230 * 230:
                      on = False
                  c = (0, 0, 0) if r2 > 240 * 240 else ((245, 245, 245) if on else (12, 12, 12))
                  row += bytes(c)
              rows.append(row)
          raw = b"".join(rows)
          ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("assets/icons/app_icon.png", "wb").write(png)
          PY

      - name: Flutter create (keep app source)
        run: |
          cp -a lib /tmp/jagx_lib
          cp pubspec.yaml /tmp/jagx_pubspec.yaml
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          rm -rf lib
          cp -a /tmp/jagx_lib lib
          cp /tmp/jagx_pubspec.yaml pubspec.yaml

      - name: Soft patch only (label + internet + release uses debug signing)
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          man = Path("android/app/src/main/AndroidManifest.xml")
          if man.exists():
              m = man.read_text()
              m = re.sub(r'android:label="[^"]*"', 'android:label="JagX AI"', m)
              if "android.permission.INTERNET" not in m:
                  m = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', m, count=1)
              if "io.supabase.jagxai" not in m:
                  intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.jagxai" android:host="login-callback"/>
                  </intent-filter>'''
                  m = m.replace("</activity>", intent + "\n        </activity>", 1)
              man.write_text(m)

          # Release signing = debug so sideload works (do not rewrite whole file)
          for name in ("build.gradle.kts", "build.gradle"):
              p = Path("android/app") / name
              if not p.exists():
                  continue
              t = p.read_text()
              if "signingConfig" not in t and "release" in t:
                  t = re.sub(
                      r"(release\s*\{)",
                      r'\1\n            signingConfig = signingConfigs.getByName("debug")' if name.endswith(".kts") else r'\1\n            signingConfig signingConfigs.debug',
                      t,
                      count=1,
                  )
                  p.write_text(t)
              print(p, "ok")
          PY

      - name: Pub get
        run: flutter pub get

      - name: Icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (save log)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: build_log.txt

      - name: Show APK
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JagX-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
