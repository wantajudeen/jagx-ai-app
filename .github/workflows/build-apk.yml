name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Generate JagX logo PNG (512)
        run: |
          mkdir -p assets/icons
          python3 << 'PY'
          from struct import pack
          import zlib

          def chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          def make_png(w, h, pixel_fn):
              rows = []
              for y in range(h):
                  row = b"\x00"
                  for x in range(w):
                      row += bytes(pixel_fn(x, y))
                  rows.append(row)
              raw = b"".join(rows)
              ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")

          # Bold white J on pure black rounded-square feel (full square for adaptive crop)
          def j_pixel(x, y, size=512):
              # background black
              bg = (0, 0, 0)
              fg = (245, 245, 245)
              # J geometry scaled to size
              s = size / 512.0
              # vertical stem
              stem = (290 * s <= x <= 350 * s) and (110 * s <= y <= 360 * s)
              # top bar
              top = (180 * s <= x <= 350 * s) and (110 * s <= y <= 165 * s)
              # bottom curve / hook of J
              hook = (160 * s <= x <= 290 * s) and (320 * s <= y <= 390 * s)
              left_leg = (160 * s <= x <= 210 * s) and (250 * s <= y <= 390 * s)
              if stem or top or hook or left_leg:
                  return fg
              return bg

          open("assets/icons/app_icon.png", "wb").write(make_png(512, 512, lambda x, y: j_pixel(x, y, 512)))
          # also write foreground for adaptive
          open("assets/icons/app_icon_fg.png", "wb").write(make_png(512, 512, lambda x, y: j_pixel(x, y, 512)))
          print("icon bytes", len(open("assets/icons/app_icon.png", "rb").read()))
          PY

      - name: Flutter create (keep app source)
        run: |
          cp -a lib /tmp/jagx_lib
          cp pubspec.yaml /tmp/jagx_pubspec.yaml
          cp -a assets /tmp/jagx_assets 2>/dev/null || true
          flutter create . --project-name jagx_ai --org com.jagx.ai --platforms=android,web
          rm -rf lib
          cp -a /tmp/jagx_lib lib
          cp /tmp/jagx_pubspec.yaml pubspec.yaml
          mkdir -p assets/icons
          cp -a /tmp/jagx_assets/. assets/ 2>/dev/null || true
          # regenerate icon after create in case assets were wiped
          if [ ! -f assets/icons/app_icon.png ]; then
            echo "icon missing after create" && exit 1
          fi

      - name: Soft patch manifest + debug signing
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path
          man = Path("android/app/src/main/AndroidManifest.xml")
          if man.exists():
              m = man.read_text()
              m = re.sub(r'android:label="[^"]*"', 'android:label="JagX AI"', m)
              if "android.permission.INTERNET" not in m:
                  m = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', m, count=1)
              if "io.supabase.jagxai" not in m:
                  intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.jagxai" android:host="login-callback"/>
                  </intent-filter>'''
                  m = m.replace("</activity>", intent + "\n        </activity>", 1)
              man.write_text(m)
          for name in ("build.gradle.kts", "build.gradle"):
              p = Path("android/app") / name
              if not p.exists(): continue
              t = p.read_text()
              if "signingConfig" not in t and "release" in t:
                  if name.endswith(".kts"):
                      t = re.sub(r"(release\s*\{)", r'\1\n            signingConfig = signingConfigs.getByName("debug")', t, count=1)
                  else:
                      t = re.sub(r"(release\s*\{)", r'\1\n            signingConfig signingConfigs.debug', t, count=1)
                  p.write_text(t)
          PY

      - run: flutter pub get

      - name: Apply launcher icons (must succeed)
        run: |
          dart run flutter_launcher_icons
          # Force-overwrite any remaining Flutter defaults in mipmap folders
          python3 << 'PY'
          from pathlib import Path
          import shutil, struct, zlib

          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          def make_png(w, h):
              rows = []
              s = w / 512.0
              for y in range(h):
                  row = b"\x00"
                  for x in range(w):
                      stem = (290 * s <= x <= 350 * s) and (110 * s <= y <= 360 * s)
                      top = (180 * s <= x <= 350 * s) and (110 * s <= y <= 165 * s)
                      hook = (160 * s <= x <= 290 * s) and (320 * s <= y <= 390 * s)
                      left_leg = (160 * s <= x <= 210 * s) and (250 * s <= y <= 390 * s)
                      c = (245, 245, 245) if (stem or top or hook or left_leg) else (0, 0, 0)
                      row += bytes(c)
                  rows.append(row)
              raw = b"".join(rows)
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              png = make_png(size, size)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  (d / name).write_bytes(png)
                  print("wrote", d / name, len(png))
          # adaptive background pure black
          anydpi = res / "mipmap-anydpi-v26"
          if anydpi.exists():
              for f in anydpi.glob("*.xml"):
                  print("adaptive xml", f)
          print("icons forced")
          PY

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-build-log
          path: build_log.txt

      - name: Copy APK for site + release
        if: success()
        run: |
          mkdir -p downloads
          cp build/app/outputs/flutter-apk/app-release.apk downloads/JagX-AI.apk
          ls -lh downloads/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JagX-AI-Android-APK
          path: downloads/JagX-AI.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JagX AI Android APK
          body: |
            Latest JagX AI Android APK — JagX J icon (not Flutter).
            Uninstall old app first, then install JagX-AI.apk
          files: downloads/JagX-AI.apk
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
