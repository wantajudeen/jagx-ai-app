<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>JagX AI</title>
<meta name="description" content="JagX AI by JagX & JRILICENSE"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100' rx='22'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23fff' font-family='system-ui' font-weight='700'>J</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#000;--card:#111;--line:#1f1f1f;--text:#ececec;--muted:#8a8a8a;--faint:#5c5c5c;--bubble:#1a1a1a;--purple:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:14px}
.top-right{display:flex;gap:6px;align-items:center}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500}
.pill:hover{background:var(--card);color:var(--text)}
.pill.solid{background:#fff;color:#000;border-color:#fff}
.main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;width:100%}
.thread{flex:1;width:100%;max-width:740px;overflow-y:auto;padding:24px 16px 12px}
.welcome{margin:10vh auto 0;text-align:center;max-width:520px;padding:0 8px}
.welcome h1{font-size:clamp(28px,5vw,36px);font-weight:600;letter-spacing:-.04em;margin-bottom:10px}
.welcome p{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:28px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){.suggestions{grid-template-columns:1fr}}
.sug{text-align:left;padding:14px;border:1px solid var(--line);border-radius:16px;font-size:13px;line-height:1.4}
.sug:hover{background:var(--card)}
.sug span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.msg{display:flex;gap:12px;margin:0 auto 22px;max-width:740px}
.msg.user{justify-content:flex-end}
.avatar{width:28px;height:28px;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.msg.user .avatar{display:none}
.bubble{max-width:min(100%,640px);font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--bubble);border-radius:18px;padding:10px 14px}
.err{color:#f87171}
.composer-wrap{width:100%;max-width:740px;padding:8px 16px 20px;flex-shrink:0}
.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:24px;background:#0c0c0c;padding:10px 10px 10px 16px}
.composer:focus-within{border-color:#333}
textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:15px;resize:none;max-height:140px;line-height:1.45;padding:6px 0}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{text-align:center;color:var(--faint);font-size:11px;margin-top:10px}
.sheet-bg,.auth-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet-bg.open,.auth-bg.open{display:flex}
.sheet,.auth-card{width:100%;max-width:400px;background:#111;border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.auth-card h2{font-size:20px;margin-bottom:6px}
.auth-card p.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.auth-card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.auth-card input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;color:var(--text)}
.auth-card .btn{display:block;width:100%;text-align:center;background:#fff;color:#000;border-radius:12px;padding:12px;font-weight:600;font-size:14px;margin-top:14px}
.auth-card .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.auth-card .err{color:#f87171;font-size:13px;margin-top:10px}
.auth-card .ok{color:#86efac;font-size:13px;margin-top:10px}
.auth-card .toggle{text-align:center;margin-top:12px;color:var(--muted);font-size:13px}
.auth-card .toggle button{color:var(--text);text-decoration:underline}
.locked .composer{opacity:.45;pointer-events:none}
.user-chip{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><div class="logo">J</div>JagX AI</div>
    <div class="top-right">
      <span class="user-chip" id="userChip"></span>
      <button class="pill" id="btnAuth" type="button">Sign in</button>
      <button class="pill" id="btnNew" type="button">New chat</button>
      <button class="pill solid" id="btnDl" type="button">Get app</button>
    </div>
  </header>

  <main class="main locked" id="main">
    <div class="thread" id="thread">
      <div class="welcome" id="welcome">
        <h1>What do you want to know?</h1>
        <p>Sign in to chat with JagX AI. Built by JagX &amp; JRILICENSE.</p>
        <div class="suggestions" id="sugs"></div>
      </div>
    </div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Sign in to ask anything" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="button" aria-label="Send">↑</button>
      </div>
      <div class="hint">Create a free account to search and chat.</div>
    </div>
  </main>

  <div class="auth-bg open" id="authModal">
    <div class="auth-card">
      <h2 id="authTitle">Sign in</h2>
      <p class="sub">Required before you can chat on the web.</p>
      <button class="btn ghost" id="btnGoogle" type="button">Continue with Google</button>
      <div style="text-align:center;color:var(--faint);font-size:12px;margin:12px 0">or email</div>
      <div id="nameWrap" style="display:none">
        <label>Full name</label>
        <input id="authName" autocomplete="name"/>
      </div>
      <label>Email</label>
      <input id="authEmail" type="email" autocomplete="email"/>
      <label>Password</label>
      <input id="authPass" type="password" autocomplete="current-password"/>
      <div class="err" id="authErr" style="display:none"></div>
      <div class="ok" id="authOk" style="display:none"></div>
      <button class="btn" id="authSubmit" type="button">Sign in</button>
      <div class="toggle">
        <button type="button" id="authToggle">New here? Create an account</button>
      </div>
    </div>
  </div>

  <div class="sheet-bg" id="sheet">
    <div class="sheet">
      <h3 style="margin-bottom:6px">Download JagX for Android</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Direct APK — no GitHub account required.</p>
      <a class="btn" style="display:block;text-align:center;background:#fff;color:#000;border-radius:12px;padding:12px;font-weight:600" href="https://github.com/wantajudeen/jagx-ai-app/releases/download/apk-latest/JagX-AI.apk">Download APK</a>
      <button class="pill" style="width:100%;margin-top:12px" id="sheetClose" type="button">Close</button>
    </div>
  </div>

<script>
(function(){
  const API = 'https://jagx-ai-v2.onrender.com';
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
  const hasSb = SUPABASE_URL && !SUPABASE_URL.includes('__SUPABASE') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('__SUPABASE');

  let supabase = null;
  if (hasSb && window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const thread = document.getElementById('thread');
  const welcome = document.getElementById('welcome');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const main = document.getElementById('main');
  const authModal = document.getElementById('authModal');
  const authTitle = document.getElementById('authTitle');
  const authSubmit = document.getElementById('authSubmit');
  const authToggle = document.getElementById('authToggle');
  const nameWrap = document.getElementById('nameWrap');
  const authErr = document.getElementById('authErr');
  const authOk = document.getElementById('authOk');
  const userChip = document.getElementById('userChip');
  const btnAuth = document.getElementById('btnAuth');
  const history = [];
  let modeSignUp = false;
  let session = null;

  const ideas = [
    ['Explain simply', 'Explain APIs like I am 12'],
    ['Write code', 'Python function to sort dicts by a key'],
    ['Naira budget', '3-month small business plan in Naira'],
    ['Translate', 'Translate to Tagalog: Take care always'],
  ];
  const sugs = document.getElementById('sugs');
  ideas.forEach(([t,p])=>{
    const b=document.createElement('button');
    b.type='button';b.className='sug';
    b.innerHTML=t+'<span>'+p+'</span>';
    b.onclick=()=>{ if(!session){ openAuth(); return; } input.value=p; send(); };
    sugs.appendChild(b);
  });

  function setSession(s){
    session = s;
    if (s) {
      main.classList.remove('locked');
      authModal.classList.remove('open');
      input.placeholder = 'Ask anything';
      const email = (s.user && s.user.email) || 'Signed in';
      userChip.textContent = email;
      btnAuth.textContent = 'Sign out';
    } else {
      main.classList.add('locked');
      authModal.classList.add('open');
      input.placeholder = 'Sign in to ask anything';
      userChip.textContent = '';
      btnAuth.textContent = 'Sign in';
    }
  }

  function openAuth(){ authModal.classList.add('open'); }

  function showErr(m){ authErr.style.display='block'; authErr.textContent=m; authOk.style.display='none'; }
  function showOk(m){ authOk.style.display='block'; authOk.textContent=m; authErr.style.display='none'; }
  function clearMsg(){ authErr.style.display='none'; authOk.style.display='none'; }

  async function initAuth(){
    if (!supabase) {
      showErr('Supabase secrets missing. Add SUPABASE_URL and SUPABASE_ANON_KEY in GitHub Actions secrets, then redeploy website.');
      return;
    }
    const { data } = await supabase.auth.getSession();
    setSession(data.session);
    supabase.auth.onAuthStateChange((_event, s) => setSession(s));
  }

  authToggle.onclick = () => {
    modeSignUp = !modeSignUp;
    authTitle.textContent = modeSignUp ? 'Create account' : 'Sign in';
    authSubmit.textContent = modeSignUp ? 'Create account' : 'Sign in';
    authToggle.textContent = modeSignUp ? 'Already have an account? Sign in' : 'New here? Create an account';
    nameWrap.style.display = modeSignUp ? 'block' : 'none';
    clearMsg();
  };

  authSubmit.onclick = async () => {
    if (!supabase) return showErr('Supabase not configured');
    clearMsg();
    const email = (document.getElementById('authEmail').value || '').trim();
    const password = document.getElementById('authPass').value || '';
    const name = (document.getElementById('authName').value || '').trim();
    try {
      if (modeSignUp) {
        if (!name) return showErr('Enter your name');
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { data: { full_name: name, name } }
        });
        if (error) return showErr(error.message);
        if (!data.session) return showOk('Check your email to confirm, then sign in.');
        setSession(data.session);
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return showErr(error.message);
        setSession(data.session);
      }
    } catch (e) {
      showErr(String(e.message || e));
    }
  };

  document.getElementById('btnGoogle').onclick = async () => {
    if (!supabase) return showErr('Supabase not configured');
    clearMsg();
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if (error) showErr(error.message);
  };

  btnAuth.onclick = async () => {
    if (session && supabase) {
      await supabase.auth.signOut();
      setSession(null);
    } else {
      openAuth();
    }
  };

  function renderMd(text){
    let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre style="background:#0d0d0d;border:1px solid #1f1f1f;border-radius:12px;padding:12px;overflow-x:auto;margin:10px 0"><code>'+c.trim()+'</code></pre>');
    s = s.replace(/`([^`]+)`/g,'<code style="background:#161616;padding:1px 5px;border-radius:4px">$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\n/g,'<br>');
    return s;
  }

  function addMsg(text, user, isErr){
    welcome.style.display='none';
    const row=document.createElement('div');
    row.className='msg'+(user?' user':'');
    if(!user){
      const av=document.createElement('div');
      av.className='avatar';av.textContent='J';
      row.appendChild(av);
    }
    const bub=document.createElement('div');
    bub.className='bubble'+(isErr?' err':'');
    if(user) bub.textContent=text; else bub.innerHTML=renderMd(text);
    row.appendChild(bub);
    thread.appendChild(row);
    thread.scrollTop=thread.scrollHeight;
  }

  async function send(){
    if (!session) { openAuth(); return; }
    const text=(input.value||'').trim();
    if(!text||sendBtn.disabled) return;
    input.value=''; input.style.height='auto';
    addMsg(text,true);
    history.push({role:'user',content:text});
    sendBtn.disabled=true;
    try{
      const r=await fetch(API+'/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ message:text, history:history.slice(0,-1).slice(-8) })
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok){
        addMsg((data.detail||data.message||('Error '+r.status))+'',false,true);
      } else {
        const reply=data.response||'';
        addMsg(reply,false);
        history.push({role:'assistant',content:reply});
      }
    }catch(e){
      addMsg('Network issue — try again in a few seconds.',false,true);
    }finally{
      sendBtn.disabled=false; input.focus();
    }
  }

  sendBtn.onclick=send;
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; });
  document.getElementById('btnNew').onclick=()=>{ history.length=0; thread.querySelectorAll('.msg').forEach(n=>n.remove()); welcome.style.display=''; };
  const sheet=document.getElementById('sheet');
  document.getElementById('btnDl').onclick=()=>sheet.classList.add('open');
  document.getElementById('sheetClose').onclick=()=>sheet.classList.remove('open');
  sheet.addEventListener('click',e=>{ if(e.target===sheet) sheet.classList.remove('open'); });

  initAuth();
})();
</script>
</body>
</html>
