<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>JagX AI</title>
<meta name="description" content="JagX AI by JagX & JRILICENSE"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23aaa' stroke-width='6'/><line x1='28' y1='72' x2='72' y2='28' stroke='%23aaa' stroke-width='6' stroke-linecap='round'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--card:#141414;--line:#2a2a2a;--text:#f2f2f2;--muted:#9a9a9a;--dim:#6a6a6a;--bubble:#1a1a1a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px}
.top-right{display:flex;gap:6px;align-items:center}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.pill:hover{background:var(--card);color:var(--text)}
.pill.solid{background:#fff;color:#000;border-color:#fff}
.main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;width:100%}
.thread{flex:1;width:100%;max-width:740px;overflow-y:auto;padding:24px 16px 12px;display:flex;flex-direction:column}
.welcome{margin:auto;text-align:center;padding:24px}
.welcome svg{width:72px;height:72px;opacity:.55;margin-bottom:20px}
.msg{display:flex;gap:12px;margin:0 auto 20px;max-width:740px;width:100%}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(100%,640px);font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--bubble);border-radius:18px;padding:10px 14px}
.err{color:#f87171}
.composer-wrap{width:100%;max-width:740px;padding:8px 16px 20px}
.composer{border-radius:24px;background:var(--card);padding:10px 12px}
.composer textarea{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;resize:none;max-height:140px;padding:6px 4px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.send{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:700;margin-left:auto}
.send:disabled{opacity:.35}
.hint{text-align:center;color:var(--dim);font-size:11px;margin-top:10px}
.auth-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.auth-bg.open{display:flex}
.auth-card{width:100%;max-width:400px;background:#111;border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.auth-card h2{font-size:20px;margin-bottom:6px}
.auth-card p.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.auth-card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.auth-card input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;color:var(--text)}
.auth-card .btn{display:block;width:100%;text-align:center;background:#fff;color:#000;border-radius:12px;padding:12px;font-weight:600;margin-top:14px}
.auth-card .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.auth-card .err{color:#f87171;font-size:13px;margin-top:10px}
.auth-card .ok{color:#86efac;font-size:13px;margin-top:10px}
.locked .composer{opacity:.45;pointer-events:none}
.user-chip{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:420px;background:#111;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 18px 28px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="22" stroke="#aaa" stroke-width="6"/><line x1="28" y1="72" x2="72" y2="28" stroke="#aaa" stroke-width="6" stroke-linecap="round"/></svg>
    JagX AI
  </div>
  <div class="top-right">
    <span class="user-chip" id="userChip"></span>
    <button class="pill" id="btnAuth" type="button">Sign in</button>
    <button class="pill" id="btnNew" type="button">New chat</button>
    <button class="pill solid" id="btnDl" type="button">Get app</button>
  </div>
</header>
<main class="main locked" id="main">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="22" stroke="#666" stroke-width="6"/><line x1="28" y1="72" x2="72" y2="28" stroke="#666" stroke-width="6" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Sign in to ask anything"></textarea>
      <div class="row">
        <button class="send" id="send" type="button">↑</button>
      </div>
    </div>
    <div class="hint">Create a free account to chat · JagX &amp; JRILICENSE</div>
  </div>
</main>
<div class="auth-bg open" id="authModal">
  <div class="auth-card">
    <h2 id="authTitle">Sign in</h2>
    <p class="sub">Required before you can chat on the web.</p>
    <button class="btn ghost" id="btnGoogle" type="button">Continue with Google</button>
    <div style="text-align:center;color:var(--dim);font-size:12px;margin:12px 0">or email</div>
    <div id="nameWrap" style="display:none"><label>Full name</label><input id="authName"/></div>
    <label>Email</label><input id="authEmail" type="email"/>
    <label>Password</label><input id="authPass" type="password"/>
    <div class="err" id="authErr" style="display:none"></div>
    <div class="ok" id="authOk" style="display:none"></div>
    <button class="btn" id="authSubmit" type="button">Sign in</button>
    <div style="text-align:center;margin-top:12px;color:var(--muted);font-size:13px">
      <button type="button" id="authToggle">New here? Create an account</button>
    </div>
  </div>
</div>
<div class="sheet-bg" id="sheet">
  <div class="sheet">
    <h3 style="margin-bottom:8px">Download Android app</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">No GitHub login needed.</p>
    <a href="https://github.com/wantajudeen/jagx-ai-app/releases/download/apk-latest/JagX-AI.apk" style="display:block;text-align:center;background:#fff;color:#000;border-radius:12px;padding:12px;font-weight:600;text-decoration:none">Download APK</a>
    <button class="pill" style="width:100%;margin-top:12px" id="sheetClose" type="button">Close</button>
  </div>
</div>
<script>
(function(){
  const API='https://jagx-ai-v2.onrender.com';
  const SUPABASE_URL='__SUPABASE_URL__';
  const SUPABASE_ANON_KEY='__SUPABASE_ANON_KEY__';
  const hasSb=SUPABASE_URL&&!SUPABASE_URL.includes('__SUPABASE')&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes('__SUPABASE');
  let supabase=null;
  if(hasSb&&window.supabase) supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const thread=document.getElementById('thread'), welcome=document.getElementById('welcome');
  const input=document.getElementById('input'), sendBtn=document.getElementById('send'), main=document.getElementById('main');
  const authModal=document.getElementById('authModal'), authTitle=document.getElementById('authTitle');
  const authSubmit=document.getElementById('authSubmit'), authToggle=document.getElementById('authToggle');
  const nameWrap=document.getElementById('nameWrap'), authErr=document.getElementById('authErr'), authOk=document.getElementById('authOk');
  const userChip=document.getElementById('userChip'), btnAuth=document.getElementById('btnAuth');
  const history=[]; let modeSignUp=false; let session=null;
  function setSession(s){
    session=s;
    if(s){ main.classList.remove('locked'); authModal.classList.remove('open'); input.placeholder='Ask anything';
      userChip.textContent=(s.user&&s.user.email)||'Signed in'; btnAuth.textContent='Sign out';
    } else { main.classList.add('locked'); authModal.classList.add('open'); input.placeholder='Sign in to ask anything';
      userChip.textContent=''; btnAuth.textContent='Sign in'; }
  }
  function showErr(m){authErr.style.display='block';authErr.textContent=m;authOk.style.display='none'}
  function showOk(m){authOk.style.display='block';authOk.textContent=m;authErr.style.display='none'}
  async function initAuth(){
    if(!supabase){ showErr('Add SUPABASE_URL and SUPABASE_ANON_KEY to GitHub Secrets, redeploy site.'); return; }
    const {data}=await supabase.auth.getSession(); setSession(data.session);
    supabase.auth.onAuthStateChange((_e,s)=>setSession(s));
  }
  authToggle.onclick=()=>{ modeSignUp=!modeSignUp; authTitle.textContent=modeSignUp?'Create account':'Sign in';
    authSubmit.textContent=modeSignUp?'Create account':'Sign in';
    authToggle.textContent=modeSignUp?'Already have an account? Sign in':'New here? Create an account';
    nameWrap.style.display=modeSignUp?'block':'none'; };
  authSubmit.onclick=async()=>{
    if(!supabase)return showErr('Supabase not configured');
    const email=(document.getElementById('authEmail').value||'').trim();
    const password=document.getElementById('authPass').value||'';
    const name=(document.getElementById('authName').value||'').trim();
    try{
      if(modeSignUp){
        if(!name)return showErr('Enter your name');
        const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:name,name}}});
        if(error)return showErr(error.message);
        if(!data.session)return showOk('Check your email to confirm, then sign in.');
        setSession(data.session);
      } else {
        const {data,error}=await supabase.auth.signInWithPassword({email,password});
        if(error)return showErr(error.message); setSession(data.session);
      }
    }catch(e){showErr(String(e.message||e));}
  };
  document.getElementById('btnGoogle').onclick=async()=>{
    if(!supabase)return showErr('Supabase not configured');
    const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});
    if(error)showErr(error.message);
  };
  btnAuth.onclick=async()=>{ if(session&&supabase){await supabase.auth.signOut();setSession(null);} else authModal.classList.add('open'); };
  function addMsg(text,user,isErr){
    welcome.style.display='none';
    const row=document.createElement('div'); row.className='msg'+(user?' user':'');
    const bub=document.createElement('div'); bub.className='bubble'+(isErr?' err':'');
    bub.textContent=text; row.appendChild(bub); thread.appendChild(row); thread.scrollTop=thread.scrollHeight;
  }
  async function send(){
    if(!session){authModal.classList.add('open');return;}
    const text=(input.value||'').trim(); if(!text||sendBtn.disabled)return;
    input.value=''; addMsg(text,true); history.push({role:'user',content:text}); sendBtn.disabled=true;
    try{
      const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'jagx-984199d487c01240f4515157a11cd6b4'},body:JSON.stringify({message:text,history:history.slice(0,-1).slice(-8)})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok) addMsg((data.detail||data.message||('Error '+r.status))+'',false,true);
      else { const reply=data.response||''; addMsg(reply,false); history.push({role:'assistant',content:reply}); }
    }catch(e){ addMsg('Network issue — try again shortly.',false,true); }
    finally{ sendBtn.disabled=false; input.focus(); }
  }
  sendBtn.onclick=send;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  document.getElementById('btnNew').onclick=()=>{history.length=0;thread.querySelectorAll('.msg').forEach(n=>n.remove());welcome.style.display='';};
  const sheet=document.getElementById('sheet');
  document.getElementById('btnDl').onclick=()=>sheet.classList.add('open');
  document.getElementById('sheetClose').onclick=()=>sheet.classList.remove('open');
  initAuth();
})();
</script>
</body>
</html>
