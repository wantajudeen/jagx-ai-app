<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>JagX AI</title>
<meta name="description" content="JagX AI by JagX and JRILICENSE"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23111'/><text x='32' y='40' text-anchor='middle' font-family='system-ui' font-size='18' font-weight='700' fill='%23aaa'>JX</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#000;--panel:#0c0c0c;--card:#161616;--line:#262626;--text:#f0f0f0;--muted:#8f8f8f;--dim:#5c5c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}

/* header */
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:#141414;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:#b0b0b0;letter-spacing:.04em;flex-shrink:0}
.brand-title{font-size:15px;font-weight:600;white-space:nowrap}
.brand-title span{color:var(--muted);font-weight:500;margin-left:5px}
.actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn{height:32px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--line);background:transparent;white-space:nowrap}
.btn:hover{color:var(--text);background:#141414}
.btn.primary{background:#fff;color:#000;border-color:#fff;font-weight:600}
.btn.primary:hover{opacity:.9}
.user{font-size:12px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* main */
.main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto}
.thread{flex:1;overflow-y:auto;padding:20px 16px 12px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim)}
.empty .mark{width:52px;height:52px;font-size:15px;border-radius:14px}

.row-msg{margin:0 0 16px}
.row-msg.user{display:flex;justify-content:flex-end}
.bubble{max-width:92%;font-size:15px;line-height:1.55;word-break:break-word}
.row-msg.user .bubble{background:#1a1a1a;border-radius:16px;padding:10px 14px}
.row-msg.bot .bubble{padding:2px 0}
.meta{display:flex;gap:8px;margin-top:8px}
.meta button{font-size:12px;color:var(--dim);padding:4px 8px;border-radius:8px;border:1px solid transparent}
.meta button:hover{color:var(--text);border-color:var(--line)}

pre.code{background:#0a0a0a;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:10px 0;font-size:13px;line-height:1.45;position:relative}
pre.code .copy{position:absolute;top:8px;right:8px;font-size:11px;color:var(--muted);background:#161616;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
img.gen{max-width:min(100%,360px);border-radius:14px;margin:10px 0;border:1px solid var(--line);display:block}

.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:4px 0 12px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;animation:p 1s infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}

.composer-wrap{padding:8px 14px 16px;flex-shrink:0}
.composer{background:var(--card);border-radius:22px;padding:10px 12px;border:1px solid var(--line)}
.composer textarea{width:100%;border:0;outline:0;background:transparent;resize:none;max-height:140px;font-size:15px;line-height:1.4;padding:4px 2px;color:var(--text)}
.composer textarea::placeholder{color:var(--dim)}
.bar{display:flex;align-items:center;gap:8px;margin-top:6px}
.chip{font-size:12px;color:var(--muted);background:#0a0a0a;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.send{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;margin-left:auto;display:grid;place-items:center;font-weight:700;font-size:16px}
.send:disabled{opacity:.35}
.foot{text-align:center;color:var(--dim);font-size:11px;margin-top:8px}

/* auth modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.open{display:flex}
.card{width:100%;max-width:380px;background:#111;border:1px solid var(--line);border-radius:16px;padding:22px 18px}
.card h2{font-size:18px;font-weight:600;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.card input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a}
.card .full{width:100%;margin-top:12px;height:42px;border-radius:11px;font-weight:600}
.card .ghost{border:1px solid var(--line);background:transparent;color:var(--text)}
.card .solid{background:#fff;color:#000}
.err{color:#f87171;font-size:13px;margin-top:10px;line-height:1.4;white-space:pre-wrap}
.ok{color:#86efac;font-size:13px;margin-top:10px}
.or{text-align:center;color:var(--dim);font-size:12px;margin:12px 0}
.switch{text-align:center;margin-top:12px;font-size:13px;color:var(--muted)}
.locked .composer{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark">JX</div>
    <div class="brand-title">JagX<span>AI</span></div>
  </div>
  <div class="actions">
    <span class="user" id="userChip"></span>
    <button class="btn" type="button" id="btnNew">New chat</button>
    <button class="btn" type="button" id="btnAuth">Sign in</button>
    <button class="btn primary" type="button" id="btnDl">Get app</button>
  </div>
</header>

<main class="main locked" id="main">
  <div class="thread" id="thread">
    <div class="empty" id="empty"><div class="mark">JX</div></div>
  </div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Sign in to chat"></textarea>
      <div class="bar">
        <button class="chip" type="button" id="btnImg" title="Generate image">Image</button>
        <span class="chip">Fast</span>
        <button class="send" type="button" id="send">↑</button>
      </div>
    </div>
    <div class="foot">JagX AI · JagX &amp; JRILICENSE</div>
  </div>
</main>

<div class="modal open" id="authModal">
  <div class="card">
    <h2 id="authTitle">Sign in</h2>
    <p class="sub">Sign in to chat and keep your history.</p>
    <button class="full ghost" type="button" id="btnGoogle">Continue with Google</button>
    <div class="or">or email</div>
    <div id="nameWrap" style="display:none">
      <label>Full name</label>
      <input id="authName" autocomplete="name"/>
    </div>
    <label>Email</label>
    <input id="authEmail" type="email" autocomplete="email"/>
    <label>Password</label>
    <input id="authPass" type="password" autocomplete="current-password"/>
    <div class="err" id="authErr" style="display:none"></div>
    <div class="ok" id="authOk" style="display:none"></div>
    <button class="full solid" type="button" id="authSubmit">Sign in</button>
    <div class="switch"><button type="button" id="authToggle">New here? Create an account</button></div>
  </div>
</div>

<div class="modal" id="dlModal">
  <div class="card">
    <h2>Android app</h2>
    <p class="sub">Download the APK — no GitHub login needed.</p>
    <a class="full solid" style="display:grid;place-items:center;text-decoration:none" href="https://github.com/wantajudeen/jagx-ai-app/releases/download/apk-latest/JagX-AI.apk">Download APK</a>
    <button class="full ghost" type="button" id="dlClose" style="margin-top:8px">Close</button>
  </div>
</div>

<script>
(function () {
  /* Public anon key is safe in the browser (Supabase design). */
  var API = 'https://jagx-ai-v2.onrender.com';
  var SUPABASE_URL = 'https://xxxyqzuwvavqsccnlkxa.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4eHlxenV3dmF2cXNjY25sa3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjY4MDcsImV4cCI6MjEwNTE0MjgwN30.pd3D3ULeR90gM7HB8xAlERr8swUyc_aJaIxDqc-vH2Y';

  /* Prefer injected values from Actions when present */
  var injUrl = 'https://xxxyqzuwvavqsccnlkxa.supabase.co';
  var injKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4eHlxenV3dmF2cXNjY25sa3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjY4MDcsImV4cCI6MjEwNTE0MjgwN30.pd3D3ULeR90gM7HB8xAlERr8swUyc_aJaIxDqc-vH2Y';
  if (injUrl.indexOf('__') < 0 && injUrl.indexOf('http') === 0) SUPABASE_URL = injUrl;
  if (injKey.indexOf('__') < 0 && injKey.length > 40) SUPABASE_ANON_KEY = injKey;

  var supabase = null;
  var session = null;
  var history = [];
  var modeSignUp = false;
  var thinkEl = null, thinkTimer = null, thinkStart = 0;
  var currentChatId = null;

  var thread = document.getElementById('thread');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var main = document.getElementById('main');
  var authModal = document.getElementById('authModal');
  var authErr = document.getElementById('authErr');
  var authOk = document.getElementById('authOk');
  var userChip = document.getElementById('userChip');

  function showErr(m) { authErr.style.display = 'block'; authErr.textContent = m; authOk.style.display = 'none'; }
  function showOk(m) { authOk.style.display = 'block'; authOk.textContent = m; authErr.style.display = 'none'; }

  function setSession(s) {
    session = s;
    if (s) {
      main.classList.remove('locked');
      authModal.classList.remove('open');
      input.placeholder = 'Ask anything';
      var u = s.user || {};
      userChip.textContent = u.email || 'Signed in';
      document.getElementById('btnAuth').textContent = 'Sign out';
      loadHistory();
    } else {
      main.classList.add('locked');
      authModal.classList.add('open');
      input.placeholder = 'Sign in to chat';
      userChip.textContent = '';
      document.getElementById('btnAuth').textContent = 'Sign in';
    }
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(); };
      document.head.appendChild(s);
    });
  }

  async function boot() {
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    } catch (e) {
      try { await loadScript('https://unpkg.com/@supabase/supabase-js@2'); }
      catch (e2) { showErr('Could not load auth library. Check network and refresh.'); return; }
    }
    if (!window.supabase) { showErr('Auth library missing.'); return; }

    /* Fetch real anon key from a tiny config endpoint if hardcode still placeholder */
    if (SUPABASE_ANON_KEY.indexOf('placeholder') >= 0) {
      try {
        var cr = await fetch('config.json', { cache: 'no-store' });
        if (cr.ok) {
          var cj = await cr.json();
          if (cj.url) SUPABASE_URL = cj.url;
          if (cj.anon) SUPABASE_ANON_KEY = cj.anon;
        }
      } catch (e) {}
    }

    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      var res = await supabase.auth.getSession();
      setSession(res.data && res.data.session);
      supabase.auth.onAuthStateChange(function (_e, s) { setSession(s); });
    } catch (e) {
      showErr('Auth error: ' + (e.message || e) + '\nConfirm Supabase is unpaused.');
    }
  }

  document.getElementById('authToggle').onclick = function () {
    modeSignUp = !modeSignUp;
    document.getElementById('authTitle').textContent = modeSignUp ? 'Create account' : 'Sign in';
    document.getElementById('authSubmit').textContent = modeSignUp ? 'Create account' : 'Sign in';
    document.getElementById('authToggle').textContent = modeSignUp ? 'Already have an account? Sign in' : 'New here? Create an account';
    document.getElementById('nameWrap').style.display = modeSignUp ? 'block' : 'none';
  };

  document.getElementById('authSubmit').onclick = async function () {
    if (!supabase) return showErr('Auth still loading — wait a moment.');
    var email = (document.getElementById('authEmail').value || '').trim();
    var password = document.getElementById('authPass').value || '';
    var name = (document.getElementById('authName').value || '').trim();
    if (!email || !password) return showErr('Email and password required');
    try {
      if (modeSignUp) {
        if (!name) return showErr('Enter your name');
        var up = await supabase.auth.signUp({ email: email, password: password, options: { data: { full_name: name } } });
        if (up.error) return showErr(up.error.message);
        if (!up.data.session) return showOk('Check your email to confirm, then sign in.');
        setSession(up.data.session);
      } else {
        var inn = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (inn.error) return showErr(inn.error.message);
        setSession(inn.data.session);
      }
    } catch (e) { showErr(String(e.message || e)); }
  };

  document.getElementById('btnGoogle').onclick = async function () {
    if (!supabase) return showErr('Auth still loading — wait a moment.');
    var r = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin } });
    if (r.error) showErr(r.error.message);
  };

  document.getElementById('btnAuth').onclick = async function () {
    if (session && supabase) { await supabase.auth.signOut(); setSession(null); history = []; renderAll(); }
    else authModal.classList.add('open');
  };

  function storageKey() {
    var id = session && session.user && session.user.id;
    return id ? ('jx_hist_' + id) : 'jx_hist_guest';
  }

  function saveHistory() {
    try { localStorage.setItem(storageKey(), JSON.stringify(history)); } catch (e) {}
    if (supabase && session && session.user) {
      supabase.from('messages').upsert({
        user_id: session.user.id,
        chat_id: currentChatId || 'default',
        payload: history,
        updated_at: new Date().toISOString()
      }).then(function () {}).catch(function () {});
    }
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(storageKey());
      if (raw) history = JSON.parse(raw) || [];
    } catch (e) { history = []; }
    renderAll();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatBot(text) {
    /* code fences → copyable blocks */
    var parts = String(text).split(/```/);
    var html = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var code = parts[i].replace(/^\w*\n/, '');
        html += '<pre class="code"><button class="copy" type="button">Copy</button><code>' + escapeHtml(code) + '</code></pre>';
      } else {
        html += escapeHtml(parts[i]).replace(/\n/g, '<br/>');
      }
    }
    return html;
  }

  function renderAll() {
    thread.innerHTML = '';
    if (!history.length) {
      thread.appendChild(empty);
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    history.forEach(function (m) {
      var row = document.createElement('div');
      row.className = 'row-msg ' + (m.role === 'user' ? 'user' : 'bot');
      var bub = document.createElement('div');
      bub.className = 'bubble';
      if (m.role === 'user') bub.textContent = m.content;
      else {
        if (m.image) {
          bub.innerHTML = '<img class="gen" src="' + escapeHtml(m.image) + '" alt="Generated"/>' +
            '<div class="meta"><a download="jagx-image.png" href="' + escapeHtml(m.image) + '" target="_blank" rel="noopener">Save image</a></div>';
        } else {
          bub.innerHTML = formatBot(m.content);
          bub.querySelectorAll('.copy').forEach(function (btn) {
            btn.onclick = function () {
              var code = btn.parentElement.querySelector('code');
              if (code) navigator.clipboard.writeText(code.textContent || '');
              btn.textContent = 'Copied';
              setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
            };
          });
          var meta = document.createElement('div');
          meta.className = 'meta';
          meta.innerHTML = '<button type="button" class="cpy-all">Copy</button>';
          meta.querySelector('.cpy-all').onclick = function () {
            navigator.clipboard.writeText(m.content || '');
            this.textContent = 'Copied';
            var t = this; setTimeout(function () { t.textContent = 'Copy'; }, 1200);
          };
          bub.appendChild(meta);
        }
      }
      row.appendChild(bub);
      thread.appendChild(row);
    });
    thread.scrollTop = thread.scrollHeight;
  }

  function startThinking() {
    stopThinking();
    thinkStart = Date.now();
    thinkEl = document.createElement('div');
    thinkEl.className = 'thinking';
    thinkEl.innerHTML = '<i></i><span class="lab">Thinking…</span>';
    thread.appendChild(thinkEl);
    thinkTimer = setInterval(function () {
      var s = Math.floor((Date.now() - thinkStart) / 1000);
      var m = Math.floor(s / 60), r = s % 60;
      var lab = thinkEl && thinkEl.querySelector('.lab');
      if (lab) lab.textContent = 'Thinking · ' + (m ? m + 'm ' + r + 's' : r + 's');
    }, 400);
    thread.scrollTop = thread.scrollHeight;
  }
  function stopThinking() {
    if (thinkTimer) clearInterval(thinkTimer);
    thinkTimer = null;
    if (thinkEl && thinkEl.parentNode) thinkEl.parentNode.removeChild(thinkEl);
    thinkEl = null;
  }

  async function send(forceImage) {
    if (!session) { authModal.classList.add('open'); return; }
    var text = (input.value || '').trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    history.push({ role: 'user', content: text });
    renderAll();
    saveHistory();
    sendBtn.disabled = true;
    startThinking();

    try {
      if (forceImage || /^\s*(draw|generate|image|picture|paint)\b/i.test(text)) {
        var prompt = text.replace(/^\s*(draw|generate|image|picture|paint)\s*(me\s*)?(an?\s*)?/i, '').trim() || text;
        var url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=1024&height=1024&nologo=true&seed=' + Date.now();
        stopThinking();
        history.push({ role: 'assistant', content: 'Image: ' + prompt, image: url });
        renderAll(); saveHistory();
      } else {
        var r = await fetch(API + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': 'jagx-984199d487c01240f4515157a11cd6b4' },
          body: JSON.stringify({ message: text, history: history.filter(function (x) { return !x.image; }).slice(0, -1).slice(-10) })
        });
        var data = await r.json().catch(function () { return {}; });
        stopThinking();
        if (!r.ok) history.push({ role: 'assistant', content: (data.detail || data.message || ('Error ' + r.status)) });
        else history.push({ role: 'assistant', content: data.response || '' });
        renderAll(); saveHistory();
      }
    } catch (e) {
      stopThinking();
      history.push({ role: 'assistant', content: 'Network issue — try again.' });
      renderAll();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.onclick = function () { send(false); };
  document.getElementById('btnImg').onclick = function () { send(true); };
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(false); }
  });

  document.getElementById('btnNew').onclick = function () {
    history = [];
    currentChatId = 'c_' + Date.now();
    saveHistory();
    renderAll();
  };

  document.getElementById('btnDl').onclick = function () { document.getElementById('dlModal').classList.add('open'); };
  document.getElementById('dlClose').onclick = function () { document.getElementById('dlModal').classList.remove('open'); };

  boot();
})();
</script>
</body>
</html>
