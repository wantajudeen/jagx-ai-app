name: jagx_ai
description: JagX AI — Grok-style intelligence for Africa
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.1.0
  dio: ^5.5.0+1
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icons/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
